<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A2C2 Contacts</title>

</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="/img/a2c2-logo.png" alt="a2c2" height="100" width="100" class="">
      </a>

      <div class="nav-links">
        <a href="index.html" class="active">Home</a>

      <a href="contacts.html" class="nav-button">
        Get Involved <span>↗</span>
      </a>
    </nav>
  </header>

  <!-- Contact Form -->
  <div class="contact-form">
    <h2>We are leaders of the next generation</h2>
    <form action="mailto:grantedbychoice@gmail.com" method="post" enctype="text/plain">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send</button>
    </form>
  </div>

  <footer class="footer">

    <div class="footer-main">

      <a href="index.html" class="logo">
        <span class="logo-mark">An</span>
        <span>A2C2 Asset</span>
      </a>

      <p>
        Culture. Creativity. Community.
      </p>

      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contacts.html">Contact</a>
      </div>

    </div>

    <div class="footer-bottom">
      <p>© 2026 A2C2. All rights reserved.</p>
      <p>Built with purpose.</p>
    </div>

  </footer>
